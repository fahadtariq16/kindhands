# Netlify: builds the React app. API forwarding lives in client/public/_redirects.
[build]
  base = "client"
  # Install the whole workspace from the repo root (includes TypeScript), then build the client.
  command = "cd .. && npm ci --include=dev && npm run build -w client"
  publish = "dist"

# Replace YOUR-API with your Render service name
[[redirects]]
  from = "/api/*"
  to = "https://kindhands-api.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app: every other path loads index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
